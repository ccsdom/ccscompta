name: Quality Gate

on:
  push:
    branches:
      - main
      - "codex-*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build and audit
    runs-on: ubuntu-latest
    env:
      CI: "true"
      FIREBASE_API_KEY: ci-placeholder
      FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
      FIREBASE_PROJECT_ID: ci-placeholder
      FIREBASE_STORAGE_BUCKET: ci-placeholder.firebasestorage.app
      FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      FIREBASE_APP_ID: 1:000000000000:web:0000000000000000000000
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-placeholder.firebasestorage.app
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_FIREBASE_APP_ID: 1:000000000000:web:0000000000000000000000
      GEMINI_API_KEY: ci-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Audit high severity vulnerabilities
        run: npm run audit:high

  backend:
    name: Backend build and audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Build
        run: npm run build
        working-directory: backend

      - name: Audit high severity vulnerabilities
        run: npm run audit:high
        working-directory: backend
